services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voltiq
      POSTGRES_USER: voltiq
      POSTGRES_PASSWORD: voltiq
    ports:
      - "5432:5432"
    volumes:
      - voltiq-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/voltiq
      SPRING_DATASOURCE_USERNAME: voltiq
      SPRING_DATASOURCE_PASSWORD: voltiq
      JWT_SECRET: VoltIQUltraPremiumEnterpriseJwtSecretKeyForHS256ChangeMe
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  voltiq-data:
