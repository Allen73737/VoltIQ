services:
  - type: web
    name: voltiq-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: ENERGY_TARIFF_PER_KWH
        value: 9.35
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,https://volt-iq-three.vercel.app
