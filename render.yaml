services:
  - type: web
    name: voltiq-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: ENERGY_TARIFF_PER_KWH
        value: 9.35
      - key: CORS_ALLOWED_ORIGINS
        sync: false
