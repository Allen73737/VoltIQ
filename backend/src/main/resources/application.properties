spring.application.name=backend
spring.application.name=voltiq
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/voltiq}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:voltiq}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:voltiq}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET:VoltIQUltraPremiumEnterpriseJwtSecretKeyForHS256ChangeMe}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.energy.tariff-per-kwh=${ENERGY_TARIFF_PER_KWH:9.35}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

logging.level.com.voltiq.energy=INFO
